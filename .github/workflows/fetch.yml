name: fetch wiki snapshot

# Every 15 minutes, offset off the hour to dodge GitHub's scheduling peak.
# Frequency basis: measured ~6.1 edits/day, 8 active users -- so most runs find
# nothing and cost a few seconds; the repo is public, so scheduled runs are free.
# Note: GitHub cron is NOT punctual -- the old '23 */3' cadence was observed
# slipping to 4-6 hours between runs, which made group announcements lag badly.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: fetch
        run: node fetch.mjs

      - name: commit if changed
        run: |
          set -e
          if [ "$(cat .dirty 2>/dev/null)" != "1" ]; then
            echo "no change this run"
            exit 0
          fi
          git config user.name  "phasmo-wiki-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "wiki snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
